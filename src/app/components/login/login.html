<div class="login-container">

  <div class="login-card">

    <h1>Login</h1>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label>Username</label>

        <input
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Enter username"
          required
        />
      </div>

      <div class="form-group">
        <label>Password</label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter password"
          required
        />
      </div>

      <button type="submit">
        Login
      </button>

    </form>

  </div>

</div>
