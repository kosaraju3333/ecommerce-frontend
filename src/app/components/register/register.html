<div class="register-page">

  <div class="register-card">

    <h1>Create Account</h1>

    <p class="subtitle">
      Register to start shopping
    </p>

    <form (ngSubmit)="register()">

      <div class="form-group">

        <label>Username</label>

        <input
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Enter username"
          required
        />

      </div>


      <div class="form-group">

        <label>Email</label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter email"
          required
        />

      </div>


      <div class="form-group">

        <label>Password</label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter password"
          required
        />

      </div>


      <p
        *ngIf="errorMessage"
        class="error-message">
        {{ errorMessage }}
      </p>


      <button
        type="submit"
        class="register-button">
        Create Account
      </button>

    </form>


    <div class="login-section">

      <span>
        Already have an account?
      </span>

      <button
        type="button"
        class="login-link"
        (click)="goToLogin()">
        Login
      </button>

    </div>

  </div>

</div>
